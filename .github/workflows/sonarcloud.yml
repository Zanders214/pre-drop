name: SonarCloud

on:
  push:
    branches: [dev, main]
    paths-ignore: ['**.md']   # docs-only changes can't affect the build
  pull_request:
    types: [opened, synchronize, reopened]
    paths-ignore: ['**.md']   # docs-only changes can't affect the build
  workflow_dispatch:

concurrency:
  group: sonarcloud-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0          # full history for accurate new-code & blame

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            ninja-build \
            gcovr \
            xvfb \
            libasound2-dev \
            libjack-jackd2-dev \
            libfreetype6-dev \
            libfontconfig1-dev \
            libx11-dev \
            libxcomposite-dev \
            libxcursor-dev \
            libxext-dev \
            libxinerama-dev \
            libxrandr-dev \
            libxrender-dev \
            libglu1-mesa-dev \
            libcurl4-openssl-dev

      # Compiler cache: JUCE's modules are most of every compile and almost never
      # change. Only push builds save, so PRs read the warm dev/main cache
      # without crowding it out of the 10 GB repo cache quota. CMake leaves the
      # launcher out of compile_commands.json, so Sonar still sees the real compiler.
      - name: ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: sonar
          max-size: 500M
          save: ${{ github.event_name != 'pull_request' }}

      - name: Cache JUCE (FetchContent)
        uses: actions/cache@v4
        with:
          path: build/_deps
          key: juce-${{ runner.os }}-8.0.4

      - name: Configure (coverage + compilation database)
        run: >
          cmake -B build
          -DCMAKE_BUILD_TYPE=Debug
          -DCMAKE_EXPORT_COMPILE_COMMANDS=ON
          -DPREDROP_ENABLE_COVERAGE=ON
          -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache

      - name: Build
        run: cmake --build build --parallel

      - name: Test
        run: ctest --test-dir build --output-on-failure

      # The plugin tests compile JUCE's module sources with --coverage too; skip
      # their data under _deps (JUCE's bundled HarfBuzz trips gcov), since only
      # Source/ is analysed anyway.
      - name: Generate coverage report
        run: gcovr --root . --exclude-directories '.*/_deps' --sonarqube > coverage.xml

      - name: SonarQube Cloud Scan
        uses: SonarSource/sonarqube-scan-action@v8
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
