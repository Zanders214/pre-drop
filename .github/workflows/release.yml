name: Release

on:
  pull_request:
    branches: [main]
    types: [closed]

permissions:
  contents: read

jobs:
  build:
    # A closed PR is not necessarily a merge. Also require the repository's own
    # dev branch so a similarly named branch in a fork cannot publish a release.
    if: >-
      github.event.pull_request.merged == true &&
      github.event.pull_request.head.ref == 'dev' &&
      github.event.pull_request.head.repo.full_name == github.repository
    name: Build release (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            os: ubuntu-latest
            artifact: linux-x64
          - name: Windows
            os: windows-latest
            artifact: windows-x64
          - name: macOS
            os: macos-latest
            artifact: macos-universal

    steps:
      - name: Checkout merged main commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            ninja-build \
            xvfb \
            libasound2-dev \
            libjack-jackd2-dev \
            libfreetype6-dev \
            libfontconfig1-dev \
            libx11-dev \
            libxcomposite-dev \
            libxcursor-dev \
            libxext-dev \
            libxinerama-dev \
            libxrandr-dev \
            libxrender-dev \
            libglu1-mesa-dev \
            libcurl4-openssl-dev

      - name: Cache JUCE (FetchContent)
        uses: actions/cache@v4
        with:
          path: build/_deps
          key: release-juce-${{ runner.os }}-8.0.4

      - name: Configure
        run: >-
          cmake -B build -DCMAKE_BUILD_TYPE=Release
          ${{ runner.os == 'macOS' && '-DCMAKE_OSX_ARCHITECTURES="arm64;x86_64"' || '' }}

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Test
        run: ctest --test-dir build --build-config Release --output-on-failure

      - name: Find AAX
        id: aax
        if: runner.os != 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          AAX="$(find build/PreDrop_artefacts -type d -name '*.aaxplugin' -prune -print -quit)"
          test -n "$AAX"
          echo "path=$AAX" >> "$GITHUB_OUTPUT"

      - name: Check AAX signing secrets
        id: pace
        if: runner.os != 'Linux'
        shell: bash
        env:
          PACE_ACCOUNT: ${{ secrets.PACE_ACCOUNT }}
          PACE_PASSWORD: ${{ secrets.PACE_PASSWORD }}
          PACE_WCGUID: ${{ secrets.PACE_WCGUID }}
          APPLE_CERTIFICATE_P12: ${{ secrets.APPLE_CERTIFICATE_P12 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGN_ID: ${{ secrets.APPLE_SIGN_ID }}
          WINDOWS_CERTIFICATE_PFX: ${{ secrets.WINDOWS_CERTIFICATE_PFX }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          set -euo pipefail
          required=(PACE_ACCOUNT PACE_PASSWORD PACE_WCGUID)
          if [ "$RUNNER_OS" = "macOS" ]; then
            required+=(APPLE_CERTIFICATE_P12 APPLE_CERTIFICATE_PASSWORD APPLE_SIGN_ID)
          else
            required+=(WINDOWS_CERTIFICATE_PFX WINDOWS_CERTIFICATE_PASSWORD)
          fi
          set_count=0
          missing=()
          for name in "${required[@]}"; do
            if [ -n "${!name}" ]; then
              set_count=$((set_count + 1))
            else
              missing+=("$name")
            fi
          done
          if [ "$set_count" -eq 0 ]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::AAX signing secrets are not set, so the AAX is not PACE-signed and only loads in Pro Tools Developer."
          elif [ "${#missing[@]}" -gt 0 ]; then
            echo "::error::AAX signing is partly configured. Missing secrets for ${RUNNER_OS}: ${missing[*]}"
            exit 1
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Find wraptool
        id: wraptool
        if: steps.pace.outputs.enabled == 'true'
        shell: bash
        env:
          PACE_WRAPTOOL: ${{ vars.PACE_WRAPTOOL }}
        run: |
          set -euo pipefail
          for candidate in "${PACE_WRAPTOOL:-}" "$(command -v wraptool || true)" \
                           /Applications/PACEAntiPiracy/Eden/Fusion/Current/bin/wraptool; do
            if [ -n "$candidate" ] && [ -x "$candidate" ]; then
              echo "path=$candidate" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          done
          echo "::error::wraptool was not found. Install PACE Eden tools and iLok License Manager on the runner, or set the PACE_WRAPTOOL repository variable to its path."
          exit 1

      - name: Sign AAX (macOS)
        if: steps.pace.outputs.enabled == 'true' && runner.os == 'macOS'
        shell: bash
        env:
          WRAPTOOL: ${{ steps.wraptool.outputs.path }}
          AAX: ${{ steps.aax.outputs.path }}
          PACE_ACCOUNT: ${{ secrets.PACE_ACCOUNT }}
          PACE_PASSWORD: ${{ secrets.PACE_PASSWORD }}
          PACE_WCGUID: ${{ secrets.PACE_WCGUID }}
          APPLE_CERTIFICATE_P12: ${{ secrets.APPLE_CERTIFICATE_P12 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGN_ID: ${{ secrets.APPLE_SIGN_ID }}
        run: |
          set -euo pipefail
          KEYCHAIN="$RUNNER_TEMP/aax-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          CERT="$RUNNER_TEMP/aax-signing.p12"
          trap 'rm -f "$CERT"' EXIT

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          printf '%s' "$APPLE_CERTIFICATE_P12" | base64 --decode > "$CERT"
          security import "$CERT" -k "$KEYCHAIN" -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" > /dev/null
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')

          SIGNED="$RUNNER_TEMP/aax-signed/$(basename "$AAX")"
          mkdir -p "$(dirname "$SIGNED")"
          "$WRAPTOOL" sign --verbose \
            --account "$PACE_ACCOUNT" \
            --password "$PACE_PASSWORD" \
            --wcguid "$PACE_WCGUID" \
            --signid "$APPLE_SIGN_ID" \
            --in "$AAX" \
            --out "$SIGNED"
          rm -rf "$AAX"
          ditto "$SIGNED" "$AAX"
          "$WRAPTOOL" verify --verbose --in "$AAX"

      - name: Sign AAX (Windows)
        if: steps.pace.outputs.enabled == 'true' && runner.os == 'Windows'
        shell: bash
        env:
          WRAPTOOL: ${{ steps.wraptool.outputs.path }}
          AAX: ${{ steps.aax.outputs.path }}
          PACE_ACCOUNT: ${{ secrets.PACE_ACCOUNT }}
          PACE_PASSWORD: ${{ secrets.PACE_PASSWORD }}
          PACE_WCGUID: ${{ secrets.PACE_WCGUID }}
          WINDOWS_CERTIFICATE_PFX: ${{ secrets.WINDOWS_CERTIFICATE_PFX }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          set -euo pipefail
          CERT="$RUNNER_TEMP/aax-signing.pfx"
          trap 'rm -f "$CERT"' EXIT
          printf '%s' "$WINDOWS_CERTIFICATE_PFX" | base64 --decode > "$CERT"

          SIGNED="$RUNNER_TEMP/aax-signed/$(basename "$AAX")"
          mkdir -p "$(dirname "$SIGNED")"
          "$WRAPTOOL" sign --verbose \
            --account "$PACE_ACCOUNT" \
            --password "$PACE_PASSWORD" \
            --wcguid "$PACE_WCGUID" \
            --keyfile "$CERT" \
            --keypassword "$WINDOWS_CERTIFICATE_PASSWORD" \
            --in "$AAX" \
            --out "$SIGNED"
          rm -rf "$AAX"
          cp -R "$SIGNED" "$AAX"
          "$WRAPTOOL" verify --verbose --in "$AAX"

      - name: Remove signing keychain
        if: always() && steps.pace.outputs.enabled == 'true' && runner.os == 'macOS'
        shell: bash
        run: security delete-keychain "$RUNNER_TEMP/aax-signing.keychain-db" || true

      - name: Package Linux release
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p package/ZandersPreDrop/VST3 package/ZandersPreDrop/Standalone dist

          VST3="$(find build/PreDrop_artefacts -type d -name '*.vst3' -print -quit)"
          STANDALONE="$(find build/PreDrop_artefacts -type f -name 'ZandersPreDrop' -path '*/Standalone/*' -print -quit)"
          test -n "$VST3"
          test -n "$STANDALONE"

          cp -R "$VST3" package/ZandersPreDrop/VST3/
          cp "$STANDALONE" package/ZandersPreDrop/Standalone/
          tar -C package -czf dist/ZandersPreDrop-Linux-x64.tar.gz ZandersPreDrop

      - name: Package Windows release
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force package/ZandersPreDrop/VST3 | Out-Null
          New-Item -ItemType Directory -Force package/ZandersPreDrop/Standalone | Out-Null
          New-Item -ItemType Directory -Force package/ZandersPreDrop/AAX | Out-Null
          New-Item -ItemType Directory -Force dist | Out-Null

          $vst3 = Get-ChildItem build/PreDrop_artefacts -Recurse -Directory -Filter *.vst3 | Select-Object -First 1
          $standalone = Get-ChildItem build/PreDrop_artefacts -Recurse -File -Filter ZandersPreDrop.exe |
            Where-Object { $_.FullName -match '[\\/]Standalone[\\/]' } |
            Select-Object -First 1
          if (-not $vst3) { throw 'Built VST3 was not found' }
          $aax = Get-ChildItem build/PreDrop_artefacts -Recurse -Directory -Filter *.aaxplugin | Select-Object -First 1
          if (-not $standalone) { throw 'Built standalone app was not found' }
          if (-not $aax) { throw 'Built AAX was not found' }

          Copy-Item $vst3.FullName package/ZandersPreDrop/VST3 -Recurse
          Copy-Item $standalone.FullName package/ZandersPreDrop/Standalone/
          Copy-Item $aax.FullName package/ZandersPreDrop/AAX -Recurse
          Compress-Archive -Path package/ZandersPreDrop -DestinationPath dist/ZandersPreDrop-Windows-x64.zip

      - name: Build macOS installer
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          PKG_ROOT="$RUNNER_TEMP/ZandersPreDrop-pkgroot"
          mkdir -p \
            "$PKG_ROOT/Library/Audio/Plug-Ins/VST3" \
            "$PKG_ROOT/Library/Audio/Plug-Ins/Components" \
            "$PKG_ROOT/Library/Application Support/Avid/Audio/Plug-Ins" \
            "$PKG_ROOT/Applications" \
            dist

          VST3="$(find build/PreDrop_artefacts -type d -name '*.vst3' -print -quit)"
          AU="$(find build/PreDrop_artefacts -type d -name '*.component' -print -quit)"
          APP="$(find build/PreDrop_artefacts -type d -name 'ZandersPreDrop.app' -print -quit)"
          AAX="$(find build/PreDrop_artefacts -type d -name '*.aaxplugin' -prune -print -quit)"
          test -n "$VST3"
          test -n "$AU"
          test -n "$APP"
          test -n "$AAX"

          ditto "$VST3" "$PKG_ROOT/Library/Audio/Plug-Ins/VST3/$(basename "$VST3")"
          ditto "$AU" "$PKG_ROOT/Library/Audio/Plug-Ins/Components/$(basename "$AU")"
          ditto "$APP" "$PKG_ROOT/Applications/$(basename "$APP")"
          ditto "$AAX" "$PKG_ROOT/Library/Application Support/Avid/Audio/Plug-Ins/$(basename "$AAX")"

          VERSION="$(sed -nE 's/^project\(PreDrop VERSION ([0-9.]+).*/\1/p' CMakeLists.txt)"
          test -n "$VERSION"
          pkgbuild \
            --root "$PKG_ROOT" \
            --identifier com.zandersaudio.predrop.installer \
            --version "${VERSION}.${GITHUB_RUN_NUMBER}" \
            --install-location / \
            --ownership recommended \
            dist/ZandersPreDrop-macOS-universal.pkg

      - name: Upload release package
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.artifact }}
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  release:
    name: Publish GitHub release
    needs: build
    if: needs.build.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout merged main commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}

      - name: Download platform packages
        uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: dist
          merge-multiple: true

      - name: Create checksums
        working-directory: dist
        run: sha256sum ZandersPreDrop-* > SHA256SUMS.txt

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          MERGE_SHA: ${{ github.event.pull_request.merge_commit_sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          AAX_SIGNED: ${{ secrets.PACE_ACCOUNT != '' }}
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(sed -nE 's/^project\(PreDrop VERSION ([0-9.]+).*/\1/p' CMakeLists.txt)"
          TAG="v${VERSION}-build.${GITHUB_RUN_NUMBER}"
          TITLE="ZandersPreDrop ${VERSION} (build ${GITHUB_RUN_NUMBER})"

          {
            printf 'Automated release from dev → main PR [#%s](%s): %s\n\n' "$PR_NUMBER" "$PR_URL" "$PR_TITLE"
            printf '### Downloads\n\n'
            printf -- '- **macOS:** Run `ZandersPreDrop-macOS-universal.pkg`. It installs the VST3, AU and AAX plug-ins system-wide, plus the standalone app in `/Applications`.\n'
            printf -- '- **Windows:** `ZandersPreDrop-Windows-x64.zip`. Copy `AAX/ZandersPreDrop.aaxplugin` to `C:\\Program Files\\Common Files\\Avid\\Audio\\Plug-Ins` for Pro Tools.\n'
            printf -- '- **Linux:** `ZandersPreDrop-Linux-x64.tar.gz`\n'
            if [ "$AAX_SIGNED" = "true" ]; then
              printf '\nThe AAX plug-ins are PACE-signed and load in Pro Tools.\n'
            else
              printf '\nThe AAX plug-ins are not PACE-signed, so they only load in Pro Tools Developer.\n'
            fi
          } > RELEASE_NOTES.md

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
          else
            gh release create "$TAG" dist/* \
              --target "$MERGE_SHA" \
              --title "$TITLE" \
              --notes-file RELEASE_NOTES.md
          fi
